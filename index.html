<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Registro de Sobras</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#e5e7eb;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
    color:#1f2937;
}

.container{
    width:100%;
    max-width:540px;
}

.card{
    background:#f8f8f8;
    border-radius:22px;
    padding:32px;
    box-shadow:0 10px 25px rgba(0,0,0,0.12);
    position:relative;
}

.top-badge{
    position:absolute;
    top:18px;
    right:18px;
    background:#4f46e5;
    color:white;
    padding:10px 16px;
    border-radius:14px;
    font-size:14px;
    font-weight:bold;
}

h1{
    text-align:center;
    margin-bottom:28px;
    font-size:22px;
    font-weight:800;
    color:#1f2937;
}

.login-box{
    margin-bottom:25px;
    padding:18px;
    background:#eceff1;
    border:1px solid #d1d5db;
    border-radius:12px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:700;
    font-size:14px;
    color:#374151;
}

input,
select{
    width:100%;
    height:44px;
    border:1px solid #c7c7c7;
    border-radius:8px;
    padding:0 14px;
    font-size:15px;
    margin-bottom:18px;
    background:white;
}

input:focus,
select:focus{
    outline:none;
    border-color:#2563eb;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}

button{
    width:100%;
    height:50px;
    border:none;
    border-radius:10px;
    background:#1877f2;
    color:white;
    font-size:20px;
    font-weight:800;
    cursor:pointer;
    transition:0.2s;
    margin-top:10px;
}

button:hover{
    background:#1664cf;
}

button:disabled {
    background: #9ca3af;
    cursor: not-allowed;
}

.status{
    margin-top:18px;
    text-align:center;
    font-weight:bold;
}

.history{
    margin-top:28px;
    background:#eceff1;
    border-radius:12px;
    padding:18px;
}

.history h3{
    margin-bottom:12px;
}

.history ul{
    list-style:none;
    max-height:200px;
    overflow:auto;
}

.history li{
    padding:10px 0;
    border-bottom:1px solid #d1d5db;
    font-size:14px;
}

.footer{
    text-align:center;
    margin-top:18px;
    font-size:13px;
    color:#6b7280;
}

.hidden{
    display:none;
}

.userLogged{
    background:#dbeafe;
    color:#1d4ed8;
    padding:10px;
    border-radius:10px;
    text-align:center;
    font-weight:bold;
    margin-bottom:20px;
}

.offline-badge {
    background: #f59e0b;
    color: white;
    font-size: 10px;
    padding: 2px 5px;
    border-radius: 4px;
    margin-left: 5px;
}

</style>
</head>

<body>

<div class="container">

<div class="card">

<div class="top-badge">
Registros: <span id="contador">0</span>
</div>

<h1>REGISTRO DE SOBRAS</h1>

<div id="loginArea">

<div class="login-box">

<label>CONFERENTE</label>

<select id="conferente">
<option value="">SELECIONE...</option>
<option>Gustavo</option>
<option>Maria</option>
<option>João</option>
<option>Ana</option>
</select>

<label>MESA</label>

<select id="mesa">
<option value="">SELECIONE...</option>
<option>Mesa 01</option>
<option>Mesa 02</option>
<option>Mesa 03</option>
<option>Mesa 04</option>
</select>

<button onclick="fazerLogin()">ENTRAR</button>

</div>

</div>

<div id="sistema" class="hidden">

<div class="userLogged" id="usuarioLogado"></div>

<div class="row">

<div>
<label>DATA</label>
<input type="text" id="dataAtual" readonly>
</div>

<div>
<label>HORÁRIO</label>
<input type="text" id="horaAtual" readonly>
</div>

</div>

<label>COD+VARIAÇÃO</label>

<input
type="text"
id="codigo"
placeholder="BIPE O PRODUTO..."
autofocus
>

<div class="row">

<div>
<label>CATEGORIA</label>

<select id="categoria">
<option value="">SELECIONE...</option>
<option>Calçado</option>
<option>Vestuário</option>
<option>Acessório</option>
<option>Suplemento</option>
</select>

</div>

<div>
<label>REVERSO</label>

<select id="statusTipo">
<option value="">SELECIONE...</option>
<option>CHECKOUT</option>
<option>COLMEIA</option>
<option>SACA</option>
</select>

</div>

</div>

<label id="labelStatusNumero">NÚMERO REVERSO</label>

<input
type="text"
id="statusNumero"
placeholder="EX: 12"
>

<button id="btnRegistrar" onclick="registrar()">FINALIZAR REGISTRO</button>

<div class="status" id="mensagem"></div>

<div class="history">

<h3>ÚLTIMOS REGISTROS</h3>

<ul id="historico"></ul>

</div>

<button onclick="sair()" style="background:#ef4444; margin-top:20px; font-size: 16px;">SAIR (LIMPAR LOGIN)</button>

</div>

</div>

<div class="footer">
© 2026 Controle operacional de sobras
</div>

</div>

<script>

const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbz4dk_avPRWpSmTqbofvspOLCKI9ksa-zwId55ohxkzzDXlzkYZHx2EmYOKLwIqHtnAjQ/exec";

let usuarioAtual = "";
let mesaAtual = "";
let contador = 0;
let processando = false;

const ultimosRegistrosTimestamps = {};

document.addEventListener("DOMContentLoaded", function() {
    checkLoginStatus();
    carregarHistoricoLocal();
    verificarFilaPendente();

    // Listener para o campo Código (Suporte a Leitor)
    document.getElementById("codigo").addEventListener("keypress", function(e) {
        if (e.key === "Enter") {
            const cat = document.getElementById("categoria").value;
            const tipo = document.getElementById("statusTipo").value;
            const num = document.getElementById("statusNumero").value;
            
            // Se já tiver categoria e reverso preenchidos, registra direto
            if(cat && tipo && num) {
                registrar();
            } else {
                document.getElementById("categoria").focus();
            }
        }
    });

    document.getElementById("statusTipo").addEventListener("change", function() {
        const label = document.getElementById("labelStatusNumero");
        const input = document.getElementById("statusNumero");
        
        if(this.value === "COLMEIA") {
            label.innerText = "COR DA COLMEIA";
            input.placeholder = "EX: AZUL";
        } else {
            label.innerText = "NÚMERO REVERSO";
            input.placeholder = "EX: 12";
        }
    });
});

function checkLoginStatus() {
    const savedConferente = localStorage.getItem("conferenteLogado");
    const savedMesa = localStorage.getItem("mesaLogada");

    if (savedConferente && savedMesa) {
        usuarioAtual = savedConferente;
        mesaAtual = savedMesa;
        iniciarSistema();
    }
}

function fazerLogin(){
    const conferente = document.getElementById("conferente").value;
    const mesa = document.getElementById("mesa").value;

    if(!conferente || !mesa){
        alert("Preencha todos os campos");
        return;
    }

    usuarioAtual = conferente;
    mesaAtual = mesa;
    localStorage.setItem("conferenteLogado", usuarioAtual);
    localStorage.setItem("mesaLogada", mesaAtual);
    iniciarSistema();
}

function iniciarSistema() {
    document.getElementById("loginArea").classList.add("hidden");
    document.getElementById("sistema").classList.remove("hidden");
    document.getElementById("usuarioLogado").innerHTML = `${usuarioAtual} | ${mesaAtual}`;
    atualizarHorario();
    setInterval(atualizarHorario,1000);
}

function sair() {
    if(confirm("Deseja realmente sair?")){
        localStorage.removeItem("conferenteLogado");
        localStorage.removeItem("mesaLogada");
        localStorage.removeItem("historicoLocal");
        window.location.reload();
    }
}

function atualizarHorario(){
    const agora = new Date();
    document.getElementById("dataAtual").value = agora.toLocaleDateString("pt-BR");
    document.getElementById("horaAtual").value = agora.toLocaleTimeString("pt-BR");
}

async function registrar(){
    if(processando) return;

    const codigo = document.getElementById("codigo").value.trim();
    const categoria = document.getElementById("categoria").value;
    const statusTipo = document.getElementById("statusTipo").value;
    const statusNumero = document.getElementById("statusNumero").value.trim();
    const mensagem = document.getElementById("mensagem");
    const btn = document.getElementById("btnRegistrar");

    const regex = /^\d{6}\+\d{3}$/;

    if(!regex.test(codigo)){
        mensagem.innerHTML = "Formato inválido. Ex: 123456+001";
        mensagem.style.color = "red";
        return;
    }

    if(!categoria || !statusTipo || !statusNumero){
        mensagem.innerHTML = "Preencha todos os campos";
        mensagem.style.color = "red";
        return;
    }

    const agora = Date.now();
    if(ultimosRegistrosTimestamps[codigo] && agora - ultimosRegistrosTimestamps[codigo] < 300000){
        if(!confirm("Este item foi registrado há menos de 5 min. Duplicar registro?")) return;
    }

    processando = true;
    btn.disabled = true;
    btn.innerText = "ENVIANDO...";
    mensagem.innerHTML = "Processando...";
    mensagem.style.color = "gray";

    const payload = {
        id: agora + Math.random(), // ID único para controle de fila
        data: new Date().toLocaleDateString("pt-BR"),
        hora: new Date().toLocaleTimeString("pt-BR"),
        timestamp: agora,
        conferente: usuarioAtual,
        mesa: mesaAtual,
        codigoCompleto: codigo,
        pedido: codigo.split("+")[0],
        variacao: codigo.split("+")[1],
        categoria: categoria,
        status: `${statusTipo} ${statusNumero}`
    };

    ultimosRegistrosTimestamps[codigo] = agora;

    try {
        await enviarParaWebhook(payload);
        mensagem.innerHTML = "Registro enviado com sucesso";
        mensagem.style.color = "green";
    } catch (error) {
        salvarNaFila(payload);
        mensagem.innerHTML = "Sem conexão. Salvo para envio automático!";
        mensagem.style.color = "#d97706";
    }

    adicionarHistorico(payload);
    limparCampos();
    processando = false;
    btn.disabled = false;
    btn.innerText = "FINALIZAR REGISTRO";
}

async function enviarParaWebhook(payload) {
    return fetch(WEBHOOK_URL, {
        method: "POST",
        body: JSON.stringify(payload)
    });
}

function limparCampos() {
    document.getElementById("codigo").value = "";
    document.getElementById("codigo").focus();
}

function adicionarHistorico(payload, isOffline = false){
    contador++;
    document.getElementById("contador").innerHTML = contador;

    const hist = JSON.parse(localStorage.getItem("historicoLocal") || "[]");
    hist.unshift(payload);
    if(hist.length > 20) hist.pop();
    localStorage.setItem("historicoLocal", JSON.stringify(hist));

    renderizarLinhaHistorico(payload);
}

function renderizarLinhaHistorico(payload) {
    const li = document.createElement("li");
    li.innerHTML = `${payload.hora} | ${payload.mesa} | ${payload.codigoCompleto} | ${payload.status}`;
    document.getElementById("historico").prepend(li);
}

function carregarHistoricoLocal() {
    const hist = JSON.parse(localStorage.getItem("historicoLocal") || "[]");
    hist.reverse().forEach(item => {
        renderizarLinhaHistorico(item);
        contador++;
    });
    document.getElementById("contador").innerHTML = contador;
}

function salvarNaFila(payload) {
    const fila = JSON.parse(localStorage.getItem("filaPendente") || "[]");
    fila.push(payload);
    localStorage.setItem("filaPendente", JSON.stringify(fila));
}

async function verificarFilaPendente() {
    setInterval(async () => {
        if(navigator.onLine) {
            const fila = JSON.parse(localStorage.getItem("filaPendente") || "[]");
            if(fila.length > 0) {
                const item = fila[0];
                try {
                    await enviarParaWebhook(item);
                    fila.shift();
                    localStorage.setItem("filaPendente", JSON.stringify(fila));
                    console.log("Item pendente enviado!");
                } catch(e) {}
            }
        }
    }, 10000);
}

</script>

</body>
</html>
